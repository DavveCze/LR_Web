  <!-- TEXT LOGA -->
  <text x="400" y="555" text-anchor="middle" class="logo-text-top">TANEČNÍ ŠKOLA</text>
  <text x="400" y="675" text-anchor="middle" class="logo-text-bottom">CARMEN</text>
