                         L 98,428 
                         L 4,428 
                         L 52,396 
                         C 88,332 135,280 198,269 
                         L 190,213 
                         C 145,152 145,88 188,32 Z" />
  </g>

  <!-- PRAVÁ POSTAVA (TANEČNICE) -->
  <g id="tanecnice">
    <!-- Horní ruka (zdvižená) -->
    <path class="skin" d="M 605,35 L 595,35 C 595,18 587,8 573,3 L 573,58 L 605,35 Z" />
    <!-- Spojená ruka uprostřed (překrývá ruku tanečníka) -->
    <path class="skin" d="M 435,173 L 374,173 C 374,183 386,188 408,188 L 408,199 L 435,173 Z" />
    <!-- Hlava -->
    <circle class="skin" cx="528" cy="145" r="42" />
