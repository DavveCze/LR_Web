<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" width="100%" height="100%">
  <!-- Definice stylů -->
  <style>
    .skin {
      fill: #F5B4B6;
      stroke: #000000;
      stroke-width: 3;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .man {
      fill: #000000;
      stroke: #000000;
      stroke-width: 2;
      stroke-linejoin: round;
    }
    .woman {
      fill: #E10B14;
      stroke: #000000;
      stroke-width: 3;
      stroke-linejoin: round;
    }
    .logo-text-top {
      font-family: 'Arial Black', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 900;
      font-size: 74px;
      fill: #000000;
      letter-spacing: 1px;
    }
    .logo-text-bottom {
      font-family: 'Arial Black', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 900;
      font-size: 98px;
      fill: #000000;
      letter-spacing: 2px;
    }
  </style>

  <!-- LEVÁ POSTAVA (TANEČNÍK) -->
  <g id="tanecnik">
    <!-- Horní ruka (zdvižená) -->
    <path class="skin" d="M 188,35 L 198,35 C 198,18 206,8 220,3 L 220,58 L 188,35 Z" />
    <!-- Spojená ruka uprostřed -->
    <path class="skin" d="M 358,173 L 392,173 L 392,186 L 385,186 L 385,196 L 358,173 Z" />
    <!-- Hlava -->
    <circle class="skin" cx="262" cy="145" r="42" />
    <!-- Tělo a končetiny -->
    <path class="man" d="M 188,32 
                         L 221,57 
                         C 192,98 196,158 232,190 
                         C 268,221 324,215 358,172 
                         L 389,197 
                         C 356,238 312,253 271,253 
                         L 268,269 
