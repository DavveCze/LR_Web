services:
  postgres:
    image: postgres:16.2-alpine
    container_name: lrdance_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - "6543:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend
      - frontend

  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    user: "1000:1000"
    env_file:
      - .env
    container_name: lrdance_php
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      CRYPTO_SECRET: ${CRYPTO_SECRET}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASS_HASH: ${ADMIN_PASS_HASH}
    volumes:
      - ./src:/var/www/html
      - ./.env:/var/www/html/.env:ro
      -  ../LR_Web_FE/public/assets/imgs:/var/www/frontend-assets:rw
    ports:
      - "8080:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - frontend
    

volumes:
  postgres_data:
    name: lrdance_postgres_data

networks:
  backend:
    internal: true
  frontend:
    driver: bridge